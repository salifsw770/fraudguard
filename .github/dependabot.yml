version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /ml-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # À ajouter quand les fichiers de dépendances existeront :
  # - maven  (directory: /backend)    : sprint 2
  # - npm    (directory: /frontend)   : sprint 2-3
